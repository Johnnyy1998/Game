name: Setup
description: Installs pnpm, Node and the workspace dependencies. Run after checkout.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
